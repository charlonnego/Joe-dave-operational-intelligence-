name: Joe&dave Native Flutter Android build
on:
  workflow_dispatch:
  push:
    branches: [main, release/pilot-readiness]
    paths:
      - 'products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/**'
      - '.github/workflows/joe-dave-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/**'
      - '.github/workflows/joe-dave-android.yml'
permissions:
  contents: read
jobs:
  build-native-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.joedave --project-name operations .
      - name: Set Joe&dave Android identity and network permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="operations"', 'android:label="Joe&amp;dave"')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest ', 1)
              marker = s.find('>')
              s = s[:marker+1] + chr(10) + '    <uses-permission android:name="android.permission.INTERNET" />' + s[marker+1:]
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build native release APK
        run: flutter build apk --release
      - name: Build Play Store App Bundle
        run: flutter build appbundle --release
      - name: Upload native Android outputs
        uses: actions/upload-artifact@v4
        with:
          name: joe-dave-flutter-native-${{ github.run_number }}
          path: |
            products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/app/outputs/flutter-apk/app-release.apk
            products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
