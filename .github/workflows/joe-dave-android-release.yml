name: Joe&dave Native Flutter signed release
on:
  workflow_dispatch:
  push:
    tags:
      - "joedave-v*"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require release signing credentials
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required Android release secret: $name"; exit 1; fi
          done
      - name: Generate native Android platform project
        run: flutter create --platforms=android --org com.joedave --project-name operations .
      - name: Install dependencies and validate Flutter app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Configure private Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joedave-upload.jks"
          chmod 600 "$RUNNER_TEMP/joedave-upload.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" "$RUNNER_TEMP/joedave-upload.jks" > android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
              s = imports + s
              load = 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
              s = s.replace("android {", load + "\nandroid {", 1)
              signing = '''    signingConfigs {
                  create("release") {
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
          '''
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              load = 'def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
              s = s.replace("android {", load + "\nandroid {", 1)
              signing = '''    signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          '''
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              p.write_text(s)
          PY
      - name: Build signed Flutter APK and Play Store bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Verify signatures and create checksums
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB"
          sha256sum "$APK" "$AAB" > release-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: joedave-native-flutter-signed-release
          path: |
            products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/app/outputs/flutter-apk/app-release.apk
            products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/app/outputs/bundle/release/app-release.aab
            products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/release-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
