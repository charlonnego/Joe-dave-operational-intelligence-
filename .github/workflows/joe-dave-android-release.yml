name: Joe&dave Android signed release
on:
  workflow_dispatch:
  push:
    tags:
      - "joedave-v*"
permissions:
  contents: read
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Require release signing credentials
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub secret for Android release signing: $name"; exit 1; fi
          done
      - name: Install Capacitor dependencies
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          printf '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Opening Joe&dave…</body></html>' > www/index.html
          npx cap add android
          npx cap sync android
      - name: Configure private release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joedave-upload.jks"
          chmod 600 "$RUNNER_TEMP/joedave-upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/joedave-upload.jks"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='android/app/build.gradle';
          let source=fs.readFileSync(path,'utf8');
          if (!source.includes('signingConfigs { release')) {
            const at=source.lastIndexOf('}');
            if(at<0) throw new Error('Could not locate Android Gradle android block');
            const signing=`
              signingConfigs {
                release {
                  storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                  storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('ANDROID_KEY_ALIAS')
                  keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                }
              }
              buildTypes {
                release { signingConfig signingConfigs.release; minifyEnabled false }
              }
            `;
            source=source.slice(0,at)+signing+'\\n'+source.slice(at);
            fs.writeFileSync(path,source);
          }
          NODE
      - name: Build signed APK and Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/joedave-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon clean assembleRelease bundleRelease
      - name: Verify signatures and create checksums
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB"
          sha256sum "$APK" "$AAB" > android/release-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: joedave-signed-android-release
          path: |
            products/joe-dave-operations-intelligence/android/app/build/outputs/apk/release/app-release.apk
            products/joe-dave-operations-intelligence/android/app/build/outputs/bundle/release/app-release.aab
            products/joe-dave-operations-intelligence/android/release-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
