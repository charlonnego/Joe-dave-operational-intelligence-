name: Joe&dave iOS preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor and generate iOS project
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          printf '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Opening Joe&dave…</body></html>' > www/index.html
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/joedave-ios-build" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/joedave-ios-build/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/joedave-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: joedave-ios-simulator-build
          path: ${{ runner.temp }}/joedave-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
