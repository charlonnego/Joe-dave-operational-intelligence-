name: Joe&dave Flutter quality gate
on:
  push:
    branches:
      - "international-standard/**"
    paths:
      - "products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/**"
      - ".github/workflows/joe-dave-flutter-quality.yml"
  pull_request:
    paths:
      - "products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/**"
      - ".github/workflows/joe-dave-flutter-quality.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
  ios-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --no-codesign
