name: Joe&dave Flutter quality and optimized Android build
on:
  workflow_dispatch:
  push:
    branches:
      - "international-standard/**"
    paths:
      - "products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/**"
      - ".github/workflows/joe-dave-flutter-quality.yml"
  pull_request:
    paths:
      - "products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/**"
      - ".github/workflows/joe-dave-flutter-quality.yml"
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing native Android scaffolding
        if: ${{ !hashFiles('products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/android/app/build.gradle', 'products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/android/app/build.gradle.kts') }}
        run: flutter create --platforms=android --org com.joedave --project-name joe_dave_operations .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Verify Android SDK configuration
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          grep -R 'compileSdk' android/app
      - name: Build optimized per-architecture release APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Build optimized Play Store Android App Bundle
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
      - name: Report Android package sizes
        run: |
          echo "Optimized release APK sizes:"
          find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f -exec du -h {} \;
          echo "Play Store App Bundle size:"
          du -h build/app/outputs/bundle/release/app-release.aab
      - name: Upload optimized per-ABI APKs for device testing
        uses: actions/upload-artifact@v4
        with:
          name: joe-and-dave-android-release-apks-per-abi
          path: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Play Store App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: joe-and-dave-android-play-store-aab
          path: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Dart obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: joe-and-dave-android-obfuscation-symbols
          path: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/build/symbols/**
          if-no-files-found: error
          retention-days: 90
  ios-simulator:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: products/joe-dave-operations-intelligence/mobile/joe_dave_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing iOS scaffolding
        if: ${{ !hashFiles('products/joe-dave-operations-intelligence/mobile/joe_dave_flutter/ios/Runner.xcodeproj/project.pbxproj') }}
        run: flutter create --platforms=ios --org com.joedave --project-name joe_dave_operations .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --no-codesign
